<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>
  <script src="./script.js" defer></script>
  <title>Personal-Finance-Tracker</title>
</head>
<body>
  <main>
    <div id="head-section">
      <!--logo img here-->
      <h1>FinTrack</h1>
      <p>Take control of your money!</p>
    </div>
    <div id="main-section">
      <div class="box" id="balance-box">
        <p>Current balance</p>
        <h2 id="balance">R$ 0,00</h2>
      </div>
    
      <div class="box" id="income-box">
        <p>Incomes</p>
        <h2 id="income">R$ 0,00</h2>
      </div>
    
      <div class="box" id="expenses-box">
        <p>Expenses</p>
        <h2 id="expense">R$ 0,00</h2>
      </div>
      <div class="box" id="add-transaction">
        <h2><button id="add-btn">+</button>  Add new transaction</h2>
        
        <p>Add a income or expense</p>
      </div>
    </div>
    
    <div id="transaction-section">
      <div class="transaction-header">
        <button id="cancel-btn">Cancel</button>
        <h3>Add Transaction</h3>
      </div>
      
      <div class="transaction-type">
        <button id="expense-btn" value="expense">Expense</button>
        <button id="income-btn" value="income">Income</button>
      </div>
      
      <div class="transaction-categorie">
        <div id="income-categorie">
          <div class="category">
            <button class="category-icon incomeBtn" value="inc-salary"><span class="material-symbols-outlined">currency_exchange</span></button>
            <p>Salary</p>
          </div>
          
          <div class="category">
            <button class="category-icon incomeBtn" value="inc-investments"><span class="material-symbols-outlined">savings</span></button>
            <p>Investments</p>
          </div>
          
          <div class="category">
            <button class="category-icon incomeBtn" value="inc-others"><span class="material-symbols-outlined">database</span></button>
            <p>Others</p>
          </div>
        </div>
        
        <div id="expense-categorie">
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-social"><span class="material-symbols-outlined">people</span></button>
            <p>Social</p>
          </div>
          
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-shopping"><span class="material-symbols-outlined">shopping_cart</span></button>
            <p>Shopping</p>
          </div>
          
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-food"><span class="material-symbols-outlined">restaurant</span></button>
            <p>Food</p>
          </div>
          
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-sports"><span class="material-symbols-outlined">directions_run</span></button>
            <p>Sports</p>
          </div>
          
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-gifts"><span class="material-symbols-outlined">featured_seasonal_and_gifts</span></button>
            <p>Gifts</p>
          </div>
          
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-education"><span class="material-symbols-outlined">school</span></button>
            <p>Education</p>
          </div>
          
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-transport"><span class="material-symbols-outlined">directions_bus</span></button>
            <p>Transport</p>
          </div>
          
          <div class="category">
            <button class="category-icon expenseBtn" value="exp-beauty"><span class="material-symbols-outlined">content_cut</span></button>
            <p>Beauty</p>
          </div>

          <div class="category">
            <button class="category-icon expenseBtn" value="exp-others"><span class="material-symbols-outlined">database</span></button>
            <p>Others</p>
          </div>         
        </div>
      </div>
      
      <div id="input-card" class="hidden">
          <h2 id="transaction-value">0</h2>
      
        <div id="numpad">
      
           <button data-value="7">7</button>
           <button data-value="8">8</button>
           <button data-value="9">9</button>
           <button data-action="date">date</button>
      
           <button data-value="4">4</button>
           <button data-value="5">5</button>
           <button data-value="6">6</button>
           <button data-action="add">+</button>
      
           <button data-value="1">1</button>
           <button data-value="2">2</button>
          <button data-value="3">3</button>
          <button data-action="subtract">−</button>
      
          <button data-value=",">,</button>
          <button data-value="0">0</button>
      
          <button data-action="delete"><span class="material-symbols-outlined">backspace</span></button>
      
          <button data-action="confirm"><span class="material-symbols-outlined">check</span>
          </button>
      
        </div>
      </div>
    </div>
    
    
    <div id="historic-section">
    </div>
    
  </main>
</body>
</html>
