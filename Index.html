<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles\style.css">
  <script src="scripts\script.js" defer></script>
  <title>Personal-Finance-Tracker</title>
</head>
<body>
  <main>
    <header>
      <!--logo img here-->
      <h1>FinTrack</h1>
      <p>Take control of your money!</p>
    </header>
    <section>
      <div class="box" id="balance">
        <p>Current balance</p>
        <h2>R$0,00</h2>
        <!--Button to see or dont the current value-->
      </div>
        
      <div class="box" id="income">
        <p>Incomes</p> 
        <h2>R$0,00</h2>
      </div>
      
      <div class="box" id="expenses">
        <p>Expenses</p>
        <h2>R$0,00</h2>
      </div>
      
      <div class="box" id="add-transaction">
        <h2><button class="add-btn">+</button>  Add new transaction</h2>
        
        <p>Add a income or expense</p>
      </div>
    </section>
    <section>
      
    </section>
  </main>
</body>
</html>
